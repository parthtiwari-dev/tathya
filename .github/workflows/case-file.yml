name: Persist case files

# As of 24 Jul 2026, case_file_persist.py calls Gemini-grounded generation by
# default (falling back to the deterministic extractive builder per topic on
# any failure -- see pipeline/generation/grounded_case_file_draft.py). This
# needs two things to actually work end to end, both one-time:
#   1. GEMINI_API_KEY set as a repo secret (below) -- without it every topic
#      silently falls back to extractive, which won't error but also won't
#      produce narrative case files.
#   2. db/migrations/008_topic_status_promotion.sql applied to Supabase --
#      without it, upsert_topic_cluster still hardcodes status='raw_cluster'
#      and topics will never show as Live regardless of generation quality.
# See docs/audit_and_next_steps.md Section 7.2 for the full history.

on:
  workflow_dispatch:
  schedule:
    - cron: "50 */2 * * *"   # offset after embed.yml's :35 so clustering sees fresh vectors

permissions:
  contents: read

jobs:
  case-file:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline with generation + embeddings extras
        run: python -m pip install ".[generation,embeddings]"
      - name: Persist promotable case-file drafts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pipeline.case_file_persist --promotable-only
