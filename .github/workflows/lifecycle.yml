name: Lifecycle status transitions

# Archives live topics with no new signal in ARCHIVE_AFTER_DAYS
# (shared/config.py, currently 60). Reopen (archived -> live on new activity)
# happens automatically inside case_file_persist.py's persist step, not here
# -- see pipeline/lifecycle/status_manager.py's module docstring.
#
# Runs once daily rather than on the 2-hour ingest/embed/case-file cycle --
# archival is a slow-moving decision, no need to check it that often.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline
        run: python -m pip install .
      - name: Archive stale live topics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m pipeline.lifecycle.status_manager
